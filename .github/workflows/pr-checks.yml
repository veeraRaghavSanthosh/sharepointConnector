name: Pull Request Checks

on:
  pull_request:
    branches: [ master, main ]

jobs:
  detect-project-type:
    runs-on: ubuntu-latest
    outputs:
      is-node: ${{ steps.detect.outputs.is-node }}
      is-python: ${{ steps.detect.outputs.is-python }}
    steps:
    - uses: actions/checkout@v4
    - name: Detect project type
      id: detect
      run: |
        if [ -f "package.json" ]; then
          echo "is-node=true" >> $GITHUB_OUTPUT
        else
          echo "is-node=false" >> $GITHUB_OUTPUT
        fi
        if [ -f "requirements.txt" ] || [ -f "pyproject.toml" ] || [ -f "setup.py" ]; then
          echo "is-python=true" >> $GITHUB_OUTPUT
        else
          echo "is-python=false" >> $GITHUB_OUTPUT
        fi

  node-tests:
    needs: detect-project-type
    if: needs.detect-project-type.outputs.is-node == 'true'
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [16.x, 18.x, 20.x]

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Check for lint script and run
      run: |
        if npm run lint --if-present; then
          echo "Linting completed"
        else
          echo "No lint script found, checking for ESLint config"
          if [ -f ".eslintrc.js" ] || [ -f ".eslintrc.json" ] || [ -f "eslint.config.js" ]; then
            npx eslint . --ext .js,.jsx,.ts,.tsx
          else
            echo "No ESLint configuration found"
          fi
        fi

    - name: Run TypeScript type checking
      run: |
        if [ -f "tsconfig.json" ]; then
          npx tsc --noEmit
        else
          echo "No TypeScript configuration found"
        fi

    - name: Run tests
      run: |
        if npm run test --if-present; then
          echo "Tests completed"
        else
          echo "No test script found, checking for test frameworks"
          if [ -f "jest.config.js" ] || [ -f "jest.config.json" ]; then
            npx jest
          else
            echo "No test configuration found"
          fi
        fi

    - name: Run build
      run: npm run build --if-present

  python-tests:
    needs: detect-project-type
    if: needs.detect-project-type.outputs.is-python == 'true'
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: [3.8, 3.9, '3.10', '3.11']

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then
          pip install -r requirements.txt
        fi
        if [ -f requirements-dev.txt ]; then
          pip install -r requirements-dev.txt
        fi
        if [ -f pyproject.toml ]; then
          pip install -e .
        fi

    - name: Run Python linting
      run: |
        if command -v flake8 &> /dev/null; then
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        fi
        if command -v black &> /dev/null; then
          black --check .
        fi

    - name: Run Python tests
      run: |
        if command -v pytest &> /dev/null; then
          pytest
        else
          python -m unittest discover
        fi

  security-check:
    runs-on: ubuntu-latest
    needs: detect-project-type
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Node.js security audit
      if: needs.detect-project-type.outputs.is-node == 'true'
      run: |
        npm ci
        npm audit --audit-level moderate
    
    - name: Python security check
      if: needs.detect-project-type.outputs.is-python == 'true'
      run: |
        python -m pip install --upgrade pip safety
        if [ -f requirements.txt ]; then
          safety check -r requirements.txt
        fi

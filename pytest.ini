[tool:pytest]
# PyTest configuration for SharePoint Connector billing tests

# Test discovery
testpaths = .
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Test execution
addopts = 
    --verbose
    --tb=short
    --strict-markers
    --strict-config
    --cov=.
    --cov-report=html:htmlcov
    --cov-report=term-missing
    --cov-report=xml
    --cov-fail-under=80
    --html=test_report.html
    --self-contained-html
    --json-report
    --json-report-file=test_report.json

# Test markers
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    fast: Fast running tests
    success: Success scenario tests
    failure: Failure scenario tests
    boundary: Boundary condition tests
    sharepoint: SharePoint-specific tests
    compatibility: Backward compatibility tests
    billing: Billing functionality tests
    payment: Payment processing tests
    invoice: Invoice generation tests
    usage: Usage tracking tests

# Test filtering
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:requests.*

# Minimum version requirements
minversion = 6.0

# Test timeout (in seconds)
timeout = 300

# Parallel execution
# Uncomment the following lines if you have pytest-xdist installed
# addopts = --numprocesses=auto